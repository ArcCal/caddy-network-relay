# Builds Caddy with the network_relay plugin and attaches it to a GitHub
# Release. Runs when a tag like v1.2.3 is pushed, or by hand from the
# Actions page (which creates the release for an existing tag).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (for example v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: arm64 }
          - { os: darwin, arch: amd64 }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -tags http2legacy -trimpath -ldflags '-s -w' -o caddy ./cmd/caddy
          name=caddy-network-relay-${{ inputs.tag || github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}
          tar -czf "$name.tar.gz" caddy
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: caddy-network-relay-*.tar.gz*

  release:
    name: attach to the release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
