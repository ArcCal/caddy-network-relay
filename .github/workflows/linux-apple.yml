name: Apple clients against Linux Relay servers
on:
  push:
    branches: [audit/linux-apple-interop-20261120]
permissions:
  contents: read
jobs:
  guest:
    name: Prepare Linux ${{ matrix.arch }} servers
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, arch: amd64}
          - {runner: ubuntu-22.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ArcCal/network-relay
          ref: 316058d8d0e358e829e66fe8d4bfaca9be5d459c
          path: rust-server
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.4'
          cache: false
      - name: Build two Linux release servers and verify their platform
        run: |
          set -euo pipefail
          uname -sm
          python3 deploy/go-tls/prepare.py "$(go env GOROOT)" "$RUNNER_TEMP/reviewed-go"
          GOTOOLCHAIN=local GOROOT="$RUNNER_TEMP/reviewed-go" CGO_ENABLED=0 go build -mod=readonly -tags http2legacy,relay_tls9846_v1 -trimpath -o "$RUNNER_TEMP/caddy" ./cmd/caddy
          cargo build --locked --release --manifest-path rust-server/Cargo.toml --bin network-relay
          file rust-server/target/release/network-relay "$RUNNER_TEMP/caddy"
          sudo bash diagnostics/linux-apple/image.sh "$RUNNER_TEMP/image" "$PWD/rust-server/target/release/network-relay" "$RUNNER_TEMP/caddy"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-${{ matrix.arch }}-guest
          path: |
            ${{ runner.temp }}/image/kernel
            ${{ runner.temp }}/image/guest.gz
            ${{ runner.temp }}/image/SHA256SUMS
          retention-days: 2
  clients:
    name: ${{ matrix.platform }} on ${{ matrix.runner }} to Linux ${{ matrix.arch }}
    needs: guest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: xcode-27, platform: macOS, arch: arm64}
          - {runner: macos-15, platform: macOS, arch: amd64}
          - {runner: xcode-27, platform: iOS, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ArcCal/network-relay
          ref: abb966352880c7521cbd9a1e23e9c2f6e70906b0
          sparse-checkout: diagnostics
          path: native-probe
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-${{ matrix.arch }}-guest
          path: ${{ runner.temp }}/image
      - name: Boot the release Linux kernel with loopback-only port forwards
        run: bash diagnostics/linux-apple/boot.sh "${{ matrix.arch }}" "$RUNNER_TEMP/image"
      - name: Prepare Apple client
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          if [[ '${{ matrix.platform }}' == macOS ]]; then
            xcrun swiftc -O -parse-as-library -target "$(uname -m)-apple-macos14.0" native-probe/diagnostics/RelayProbe.swift -o "$RUNNER_TEMP/probe"
          else
            xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
            sim_id=$(python3 - "$RUNNER_TEMP/devices.json" <<'PY'
          import json, re, sys
          data=json.load(open(sys.argv[1]))['devices']
          pairs=[(tuple(map(int,m.group(1).split('-'))),devices) for key,devices in data.items() if (m:=re.search(r'[.]iOS-([0-9]+(?:-[0-9]+)*)$',key))]
          print(next(d['udid'] for _,devices in sorted(pairs,key=lambda item:item[0],reverse=True) for d in devices if d['isAvailable'] and 'iPhone' in d['name']))
          PY
            )
            xcrun simctl bootstatus "$sim_id" -b
            sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
            xcrun --sdk iphonesimulator swiftc -O -parse-as-library -sdk "$sdk" -target "$(uname -m)-apple-ios17.0-simulator" native-probe/diagnostics/RelayProbe.swift -o "$RUNNER_TEMP/ios-probe"
            echo "RELAY_SIMULATOR_ID=$sim_id" >> "$GITHUB_ENV"
            cat > "$RUNNER_TEMP/probe" <<'PROBE'
          #!/bin/bash
          exec xcrun simctl spawn "$RELAY_SIMULATOR_ID" "$RUNNER_TEMP/ios-probe" "$@"
          PROBE
            chmod 700 "$RUNNER_TEMP/probe"
          fi
      - name: Native transfers, independent destination counts, authentication and trust controls
        shell: bash
        run: |
          python3 - <<'PY'
          import os, runpy, subprocess
          t=os.environ['RUNNER_TEMP']
          hosts=runpy.run_path('native-probe/diagnostics/run-native-probe.py')['origin_name']
          with hosts():
              subprocess.run(['python3','diagnostics/linux-apple/client.py',t+'/probe',t+'/evidence'],check=True)
          PY
      - name: Stop Linux fixture
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/guest.pid" ]]; then kill "$(cat "$RUNNER_TEMP/guest.pid")" || true; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.platform }}-${{ matrix.runner }}-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
