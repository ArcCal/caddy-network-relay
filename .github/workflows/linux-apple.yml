name: Measure Apple UDP message composition and H2 bulk alternatives
'on':
  push:
    branches:
    - audit/apple-performance-alternatives-20261120
permissions:
  contents: read
  actions: read
jobs:
  clients:
    name: ${{ matrix.study }} on ${{ matrix.platform }} to Linux ${{ matrix.arch }}
      reverse=${{ matrix.reverse }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: macOS
          arch: amd64
          runner: macos-15
          study: udp
          reverse: 'false'
        - platform: macOS
          arch: arm64
          runner: xcode-27
          study: udp
          reverse: 'false'
        - platform: iOS
          arch: arm64
          runner: xcode-27
          study: udp
          reverse: 'false'
        - platform: iOS
          arch: arm64
          runner: xcode-27
          study: bulk
          reverse: 'false'
        - platform: iOS
          arch: arm64
          runner: xcode-27
          study: bulk
          reverse: 'true'
        - platform: macOS
          arch: arm64
          runner: xcode-27
          study: bulk
          reverse: 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: abb966352880c7521cbd9a1e23e9c2f6e70906b0
        sparse-checkout: diagnostics
        path: native-probe
        persist-credentials: false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: da3b68dc4f8dc678f23857af2e5634245d31f319
        sparse-checkout: tools
        path: profile-tool
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: linux-${{ matrix.arch }}-guest
        path: ${{ runner.temp }}/image
        github-token: ${{ github.token }}
        run-id: 44747890260
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: production-pair-${{ matrix.arch }}
        path: ${{ runner.temp }}/probe-arm
        github-token: ${{ github.token }}
        run-id: 44760250937
    - name: Boot the release Linux kernel with loopback-only port forwards
      run: bash diagnostics/linux-apple/boot.sh "${{ matrix.arch }}" "$RUNNER_TEMP/image"
    - name: Prepare Apple client
      run: "set -euo pipefail\nguest_pid=$(cat \"$RUNNER_TEMP/guest.pid\")\nkill -STOP\
        \ \"$guest_pid\"\ntrap 'kill -CONT \"$guest_pid\" || true' EXIT\nif [[ \"\
        ${{ matrix.study }}\" == \"udp\" ]]; then\n  python3 diagnostics/linux-apple/boundary-probe.py\
        \ native-probe/diagnostics/RelayProbe.swift \"$RUNNER_TEMP/Train.swift\"\n\
        else\n  cp native-probe/diagnostics/RelayProbe.swift \"$RUNNER_TEMP/Train.swift\"\
        \n  python3 diagnostics/linux-apple/prepare-progress.py \"$RUNNER_TEMP/Train.swift\"\
        \nfi\nset -euo pipefail\nsw_vers\nxcodebuild -version\nif [[ '${{ matrix.platform\
        \ }}' == macOS ]]; then\n  xcrun swiftc -O -parse-as-library -target \"$(uname\
        \ -m)-apple-macos14.0\" \"$RUNNER_TEMP/Train.swift\" -o \"$RUNNER_TEMP/probe\"\
        \nelse\n  xcrun simctl list devices available -j > \"$RUNNER_TEMP/devices.json\"\
        \n  sim_id=$(python3 - \"$RUNNER_TEMP/devices.json\" <<'PY'\nimport json,\
        \ re, sys\ndata=json.load(open(sys.argv[1]))['devices']\npairs=[(tuple(map(int,m.group(1).split('-'))),devices)\
        \ for key,devices in data.items() if (m:=re.search(r'[.]iOS-([0-9]+(?:-[0-9]+)*)$',key))]\n\
        print(next(d['udid'] for _,devices in sorted(pairs,key=lambda item:item[0],reverse=True)\
        \ for d in devices if d['isAvailable'] and 'iPhone' in d['name']))\nPY\n \
        \ )\n  xcrun simctl bootstatus \"$sim_id\" -b\n  sdk=$(xcrun --sdk iphonesimulator\
        \ --show-sdk-path)\n  xcrun --sdk iphonesimulator swiftc -O -parse-as-library\
        \ -sdk \"$sdk\" -target \"$(uname -m)-apple-ios17.0-simulator\" \"$RUNNER_TEMP/Train.swift\"\
        \ -o \"$RUNNER_TEMP/ios-probe\"\n  echo \"RELAY_SIMULATOR_ID=$sim_id\" >>\
        \ \"$GITHUB_ENV\"\n  cat > \"$RUNNER_TEMP/probe\" <<'PROBE'\n#!/bin/bash\n\
        exec xcrun simctl spawn \"$RELAY_SIMULATOR_ID\" \"$RUNNER_TEMP/ios-probe\"\
        \ \"$@\"\nPROBE\n  chmod 700 \"$RUNNER_TEMP/probe\"\nfi\n"
    - name: Run native Apple probes and verify actual endpoint observations
      shell: bash
      run: python3 diagnostics/linux-apple/native-run.py
    - name: Stop Linux fixture
      if: always()
      run: 'if [[ -f "$RUNNER_TEMP/guest.pid" ]]; then kill "$(cat "$RUNNER_TEMP/guest.pid")"
        || true; fi

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: apple-alternatives-${{ matrix.study }}-${{ matrix.platform }}-${{ matrix.arch
          }}-${{ matrix.reverse }}
        path: ${{ runner.temp }}/evidence
        retention-days: 7
    env:
      RELAY_BULK_REVERSE: ${{ matrix.reverse }}
      RELAY_STUDY_SCRIPT: ${{ matrix.study == 'udp' && 'boundary-client.py' || 'profile-download.py'
        }}
