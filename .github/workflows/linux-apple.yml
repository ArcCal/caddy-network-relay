name: Native Apple file and streaming consumers on a Linux Relay
'on':
  push:
    branches:
    - audit/native-h3-reader-20261120
permissions:
  contents: read
  actions: read
jobs:
  clients:
    name: Apple file and streaming readers on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: xcode-27
          reverse: 'false'
        - runner: macos-15
          reverse: 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 85
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: abb966352880c7521cbd9a1e23e9c2f6e70906b0
        sparse-checkout: diagnostics
        path: native-probe
        persist-credentials: false
    - name: Match the Linux kernel to the actual Mac CPU and test hardware virtualization
      shell: bash
      run: "set -euo pipefail\ncase \"$(uname -m)\" in\n    arm64) arch=arm64; cmd=qemu-system-aarch64 ;;\n    x86_64) arch=amd64;\
        \ cmd=qemu-system-x86_64 ;;\n    *) exit 2 ;;\nesac\ncommand -v \"$cmd\" >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew\
        \ install qemu\necho \"RELAY_FRAME_ARCH=$arch\" >> \"$GITHUB_ENV\"\npython3 diagnostics/linux-apple/check-hvf.py\n"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: linux-${{ env.RELAY_FRAME_ARCH }}-guest
        path: ${{ runner.temp }}/image
        github-token: ${{ github.token }}
        run-id: 44747890260
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: production-pair-${{ env.RELAY_FRAME_ARCH }}
        path: ${{ runner.temp }}/probe-arm
        run-id: 44780228003
        github-token: ${{ github.token }}
    - name: Boot the release Linux kernel with loopback-only port forwards
      run: bash diagnostics/linux-apple/boot.sh "$RELAY_FRAME_ARCH" "$RUNNER_TEMP/image"
    - name: Prepare Apple client
      run: 'set -euo pipefail

        cp native-probe/diagnostics/RelayProbe.swift "$RUNNER_TEMP/FrameProbe.swift"

        python3 diagnostics/linux-apple/prepare-progress.py "$RUNNER_TEMP/FrameProbe.swift"

        python3 diagnostics/linux-apple/prepare-reader.py "$RUNNER_TEMP/FrameProbe.swift"

        xcrun swiftc -O -parse-as-library -target "$(uname -m)-apple-macos14.0" "$RUNNER_TEMP/FrameProbe.swift" -o "$RUNNER_TEMP/probe"

        '
    - name: Measure four concurrent checked downloads, CPU, QUIC credit and per-stream progress
      shell: bash
      run: python3 diagnostics/linux-apple/native-run.py
    - name: Stop Linux fixture
      if: always()
      run: 'if [[ -f "$RUNNER_TEMP/guest.pid" ]]; then kill "$(cat "$RUNNER_TEMP/guest.pid")" || true; fi

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reader-${{ matrix.runner }}
        path: ${{ runner.temp }}/evidence
        retention-days: 7
    env:
      RELAY_READER_REVERSE: ${{ matrix.reverse }}
