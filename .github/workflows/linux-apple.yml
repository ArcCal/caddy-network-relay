name: Release candidates on real Linux x86-64 and arm64 against Apple UDP
'on':
  push:
    branches:
    - audit/confirmed-datagrams-20261120
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: 03ca4e3b451e4f49e3e67b9db7386402f0d1955f
        path: baseline
        persist-credentials: false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: d7483b1fbe75b60af414ec043642b51ae5c43436
        path: candidate
        persist-credentials: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: 1.27.4
        cache: false
    - name: Exercise exact production sources with the race detector and build both
        release binaries
      run: "set -euo pipefail\npython3 candidate/deploy/go-tls/prepare.py \"$(go env\
        \ GOROOT)\" \"$RUNNER_TEMP/reviewed-go\"\nexport GOTOOLCHAIN=local GOROOT=\"\
        $RUNNER_TEMP/reviewed-go\" GOFLAGS=\"-mod=readonly -tags=http2legacy,relay_tls9846_v1\"\
        \n(cd candidate && \"$GOROOT/bin/go\" test -race -count=4 -run '^TestIdleDatagramPathMTUDiscovery$'\
        \ .)\nmkdir \"$RUNNER_TEMP/probe-arm\"\nfor revision in baseline candidate;\
        \ do\n    (cd \"$revision\" && \"$GOROOT/bin/go\" build -trimpath -o \"$RUNNER_TEMP/probe-arm/caddy-$revision\"\
        \ ./cmd/caddy)\ndone\n(cd \"$RUNNER_TEMP/probe-arm\" && sha256sum caddy-baseline\
        \ caddy-candidate > SHA256SUMS)\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: production-pair-${{ matrix.arch }}
        path: ${{ runner.temp }}/probe-arm
        retention-days: 7
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          arch: amd64
        - runner: ubuntu-22.04-arm
          arch: arm64
  clients:
    name: ${{ matrix.platform }} on ${{ matrix.runner }} to Linux ${{ matrix.arch
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: xcode-27
          platform: macOS
          arch: arm64
        - runner: macos-15
          platform: macOS
          arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: abb966352880c7521cbd9a1e23e9c2f6e70906b0
        sparse-checkout: diagnostics
        path: native-probe
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: linux-${{ matrix.arch }}-guest
        path: ${{ runner.temp }}/image
        github-token: ${{ github.token }}
        run-id: 44747890260
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: production-pair-${{ matrix.arch }}
        path: ${{ runner.temp }}/probe-arm
    - name: Boot the release Linux kernel with loopback-only port forwards
      run: bash diagnostics/linux-apple/boot.sh "${{ matrix.arch }}" "$RUNNER_TEMP/image"
    - name: Prepare Apple client
      run: 'set -euo pipefail

        python3 diagnostics/linux-apple/prepare-train.py native-probe/diagnostics/RelayProbe.swift
        "$RUNNER_TEMP/Train.swift"

        xcrun swiftc -O -parse-as-library -target "$(uname -m)-apple-macos14.0" "$RUNNER_TEMP/Train.swift"
        -o "$RUNNER_TEMP/probe"

        '
    - name: Compare immediate, idle and small-first transmissions to an isolated echo
        peer
      shell: bash
      run: python3 diagnostics/linux-apple/native-run.py
    - name: Stop Linux fixture
      if: always()
      run: 'if [[ -f "$RUNNER_TEMP/guest.pid" ]]; then kill "$(cat "$RUNNER_TEMP/guest.pid")"
        || true; fi

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ${{ matrix.platform }}-${{ matrix.runner }}-linux-${{ matrix.arch }}
        path: ${{ runner.temp }}/evidence
        retention-days: 7
    needs: candidate
