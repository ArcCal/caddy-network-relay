name: Isolate KVM acceleration on a matched Linux four-stream download
on:
  push:
    branches: [audit/linux-execution-throughput-20261120]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64, emulator: qemu-system-x86}
          - {runner: ubuntu-22.04-arm, arch: arm64, emulator: qemu-system-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ArcCal/network-relay
          ref: ad82fe823be9cc09d473a36c225f5113461877ee
          sparse-checkout: network-relay-rs
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-${{ matrix.arch }}-guest
          path: ${{ runner.temp }}/image
          github-token: ${{ github.token }}
          run-id: 44747890260
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-pair-${{ matrix.arch }}
          path: ${{ runner.temp }}/pair
          github-token: ${{ github.token }}
          run-id: 44760250937
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Verify the release ELF files and build one locked production RS client for all paths
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -y -qq install ${{ matrix.emulator }} cpio acl
          (cd "$RUNNER_TEMP/image" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/pair" && sha256sum -c SHA256SUMS && chmod 755 caddy-candidate)
          mkdir -p "$RUNNER_TEMP/linux"
          (cd "$RUNNER_TEMP/linux" && gzip -dc "$RUNNER_TEMP/image/guest.gz" | cpio -idm --quiet --no-absolute-filenames 'srv/network-relay' './srv/network-relay')
          test -x "$RUNNER_TEMP/linux/srv/network-relay"
          cargo build --locked --release --manifest-path product/network-relay-rs/Cargo.toml --target-dir "$RUNNER_TEMP/rs-target"
          echo "RS_CONTROL_BIN=$RUNNER_TEMP/rs-target/release/network-relay-rs" >> "$GITHUB_ENV"
      - name: Permit the runner account to use its local KVM device for this job
        shell: bash
        run: |
          set -euo pipefail
          if [[ -c /dev/kvm && ( ! -r /dev/kvm || ! -w /dev/kvm ) ]]; then
            getfacl -p /dev/kvm > "$RUNNER_TEMP/relay-kvm.acl"
            sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          fi
      - name: Exercise the same four-way transfer with native, translated and available accelerated Linux
        env:
          RELAY_ARCH: ${{ matrix.arch }}
        run: python3 diagnostics/linux-apple/compare-execution.py
      - name: Restore the runner-local KVM device permissions
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/relay-kvm.acl" ]]; then
            sudo setfacl --restore="$RUNNER_TEMP/relay-kvm.acl"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-kvm-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
