name: Bounded large-transfer completion and intermediate byte counts on the same Mac
'on':
  push:
    branches:
    - audit/bulk-completion-20261120
permissions:
  contents: read
  actions: read
jobs:
  clients:
    name: ${{ matrix.platform }} on ${{ matrix.runner }} to Linux ${{ matrix.arch
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: xcode-27
          platform: macOS
          arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: abb966352880c7521cbd9a1e23e9c2f6e70906b0
        sparse-checkout: diagnostics
        path: native-probe
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: linux-${{ matrix.arch }}-guest
        path: ${{ runner.temp }}/image
        github-token: ${{ github.token }}
        run-id: 44747890260
    - name: Boot the release Linux kernel with loopback-only port forwards
      run: bash diagnostics/linux-apple/boot.sh "${{ matrix.arch }}" "$RUNNER_TEMP/image"
    - name: Prepare Apple client
      run: 'set -euo pipefail

        sw_vers

        xcodebuild -version

        xcrun swiftc -O -parse-as-library -target "$(uname -m)-apple-macos14.0" native-probe/diagnostics/RelayProbe.swift
        -o "$RUNNER_TEMP/probe"

        '
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: network-relay-rs-macos-arm64
        path: ${{ runner.temp }}/rs-package
        repository: ArcCal/network-relay
        github-token: ${{ github.token }}
        run-id: 44748756161
    - name: Verify the release RS command line client
      run: 'set -euo pipefail

        cd "$RUNNER_TEMP/rs-package"

        shasum -a 256 --check network-relay-rs-*-macos-arm64.tar.gz.sha256

        archives=(network-relay-rs-*-macos-arm64.tar.gz)

        tar -xzf "${archives[0]}"

        binaries=(network-relay-rs-*-macos-arm64/network-relay-rs)

        codesign --verify --strict "${binaries[0]}"

        echo "RS_CONTROL_BIN=$PWD/${binaries[0]}" >> "$GITHUB_ENV"

        '
    - name: Verify 64 MiB serial and four-stream transfers and control paths
      shell: bash
      run: python3 diagnostics/linux-apple/native-run.py
    - name: Stop Linux fixture
      if: always()
      run: 'if [[ -f "$RUNNER_TEMP/guest.pid" ]]; then kill "$(cat "$RUNNER_TEMP/guest.pid")"
        || true; fi

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ${{ matrix.platform }}-${{ matrix.runner }}-linux-${{ matrix.arch }}
        path: ${{ runner.temp }}/evidence
        retention-days: 7
