name: Compare large-only Capsule buffer reuse against the shipping reader
'on':
  push:
    branches:
    - audit/capsule-reuse-release-control-20261120
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          arch: amd64
        - runner: ubuntu-22.04-arm
          arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: 1.27.4
        cache: false
    - name: Build reviewed binaries and test normal UDP and TLS paths
      shell: bash
      run: 'set -euo pipefail

        mkdir "$RUNNER_TEMP/evidence"

        python3 deploy/go-tls/prepare.py "$(go env GOROOT)" "$RUNNER_TEMP/reviewed-go"

        export GOROOT="$RUNNER_TEMP/reviewed-go" GOTOOLCHAIN=local GOFLAGS=''-mod=readonly
        -tags=http2legacy,relay_tls9846_v1''

        python3 diagnostics/performance/capsules.py

        python3 - <<''GEN''

        from pathlib import Path

        udp=Path("udp.go").read_text()

        source=udp[udp.index("func readCapsules("):udp.index("func discard(")]

        with Path("study_readers_test.go").open("a") as dest: dest.write(source.replace("func
        readCapsules(", "func study_borrow("))

        GEN

        python3 diagnostics/performance/hybrid.py

        cp diagnostics/performance/parallel.go.in study_parallel_test.go

        cp diagnostics/performance/measure.go.in study_measure_test.go

        "$GOROOT/bin/gofmt" -w study_{readers,measure,parallel}_test.go udp.go

        "$GOROOT/bin/go" test -race -count=1 ./... > "$RUNNER_TEMP/evidence/race.txt"
        2>&1 || { tail -50 "$RUNNER_TEMP/evidence/race.txt"; exit 1; }

        "$GOROOT/bin/go" test -c -o "$RUNNER_TEMP/measure" .

        '
    - name: Measure allocation and contention with 1, 4 and 16 Go workers
      shell: bash
      run: "set -euo pipefail\ncd \"$RUNNER_TEMP/evidence\"\nfor n in 1 2 3 4; do\n\
        \  \"$RUNNER_TEMP/measure\" -test.run '^$' -test.bench '^BenchmarkStudyParallel$'\
        \ -test.benchmem -test.benchtime 300ms -test.cpu 1,4,16 >> parallel.txt\n\
        done\n"
    - name: Counterbalance shipping and candidate in separate processes
      shell: bash
      run: "set -euo pipefail\ncd \"$RUNNER_TEMP/evidence\"\ncpu=$(python3 -c 'import\
        \ os; print(min(os.sched_getaffinity(0)))')\nfor variant in prior selected\
        \ selected prior selected prior prior selected prior selected selected prior;\
        \ do\n  printf 'reader=%s\n' \"$variant\" >> serial.txt\n  STUDY_READER=\"\
        $variant\" GOMAXPROCS=1 taskset -c \"$cpu\" \"$RUNNER_TEMP/measure\" -test.run\
        \ '^$' -test.bench '^BenchmarkStudyReader$' -test.benchmem -test.benchtime\
        \ 400ms >> serial.txt\ndone\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: large-control-${{ matrix.arch }}
        path: ${{ runner.temp }}/evidence
        retention-days: 7
