name: Candidate native Relay interoperability
on:
  push:
    branches: [audit/native-interop-20261120]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [xcode-27, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ArcCal/network-relay
          ref: 33ee4fce386f85d862fc9081a5e79633a19b7940
          path: rust-server
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ArcCal/network-relay
          ref: abb966352880c7521cbd9a1e23e9c2f6e70906b0
          sparse-checkout: diagnostics
          path: native-probe
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.4'
          cache: false
      - name: Build reviewed servers and native probe
        id: builds
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          git rev-parse HEAD
          git -C rust-server rev-parse HEAD
          python3 deploy/go-tls/prepare.py "$(go env GOROOT)" "$RUNNER_TEMP/reviewed-go"
          GOTOOLCHAIN=local GOROOT="$RUNNER_TEMP/reviewed-go" go build -mod=readonly -tags http2legacy,relay_tls9846_v1 -o "$RUNNER_TEMP/caddy" ./cmd/caddy
          cargo build --locked --release --manifest-path rust-server/Cargo.toml --bin network-relay
          xcrun swiftc -O -parse-as-library -target "$(uname -m)-apple-macos14.0" native-probe/diagnostics/RelayProbe.swift -o "$RUNNER_TEMP/relay-probe"
          openssl_bin="$(brew --prefix openssl@3)/bin"
          test -x "$openssl_bin/openssl"
          echo "$openssl_bin" >> "$GITHUB_PATH"
          cat > "$RUNNER_TEMP/measure" <<'SCRIPT'
          #!/bin/bash
          exec python3 native-probe/diagnostics/run-native-probe.py --source "$PWD/rust-server" --rust-binary "$PWD/rust-server/target/release/network-relay" --caddy-binary "$RUNNER_TEMP/caddy" --probe "$RUNNER_TEMP/relay-probe" "$@"
          SCRIPT
          chmod 700 "$RUNNER_TEMP/measure"
      - name: Native H2 and H3 downloads and uploads
        if: steps.builds.outcome == 'success'
        run: '"$RUNNER_TEMP/measure" --out "$RUNNER_TEMP/evidence/bulk"'
      - name: Native UDP boundaries with both servers
        if: always() && steps.builds.outcome == 'success'
        run: '"$RUNNER_TEMP/measure" --udp-only --udp-boundaries --out "$RUNNER_TEMP/evidence/udp"'
      - name: Native parallel downloads with bounded stall observation
        if: always() && steps.builds.outcome == 'success'
        run: '"$RUNNER_TEMP/measure" --server caddy --tcp-download-watchdog --download-rounds 4 --out "$RUNNER_TEMP/evidence/parallel"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-relay-${{ matrix.runner }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
