name: IPv6-only DNS64 and NAT64 acceptance
'on':
  push:
    branches:
    - audit/dns64-recheck-20261121
permissions:
  contents: read
  actions: read
jobs:
  nat64:
    name: IPv6-only RS through DNS64 and NAT64 on ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-24.04
        - arch: arm64
          runner: ubuntu-22.04-arm
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: 0d7d83ca37d5da9154ae0004e545a6bcf68d2c58
        path: clients
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
      with:
        toolchain: stable
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: caddy-network-relay-linux-${{ matrix.arch }}
        path: ${{ runner.temp }}/exact-caddy
        run-id: 44835734583
        github-token: ${{ github.token }}
    - name: Build current relay and RS; install isolated translation test dependencies
      run: 'sudo apt-get update -qq

        sudo apt-get install -y -qq tayga unbound dnsmasq-base dnsutils

        cargo build --locked --manifest-path clients/Cargo.toml --bin network-relay
        --release

        cargo build --locked --manifest-path clients/network-relay-rs/Cargo.toml --bin
        network-relay-rs --release

        chmod 755 "$RUNNER_TEMP/exact-caddy/caddy"

        sudo bash diagnostics/linux-apple/nat64.sh "$PWD/clients/target/release/network-relay"
        "$RUNNER_TEMP/exact-caddy/caddy" "$PWD/clients/network-relay-rs/target/release/network-relay-rs"

        '
    runs-on: ${{ matrix.runner }}
