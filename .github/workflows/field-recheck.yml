name: Measure timestamp formatting on the macOS native I/O queue
on:
  push:
    branches: [audit/tun-native-log-cost-20261121]
permissions:
  contents: read
jobs:
  trace:
    runs-on: xcode-27
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Compare identical synthetic timestamps with four implementations
      run: |
        set -eu
        xcrun swiftc -O diagnostics/history-ui/log-clock.swift -o "$RUNNER_TEMP/log-clock"
        "$RUNNER_TEMP/log-clock"
