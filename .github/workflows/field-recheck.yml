name: Signed TUN GUI Connect and Disconnect
'on':
  push:
    branches:
    - audit/tun-signed-ui-20261121
permissions:
  contents: read
  actions: read
jobs:
  gui:
    name: Signed TUN app real button missing and installed helper
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: abb966352880c7521cbd9a1e23e9c2f6e70906b0
        sparse-checkout: diagnostics
        path: native-probe
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: linux-amd64-guest
        path: ${{ runner.temp }}/image
        github-token: ${{ github.token }}
        run-id: 44747890260
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: caddy-network-relay-linux-amd64
        path: ${{ runner.temp }}/exact-caddy
        run-id: 44835734583
        github-token: ${{ github.token }}
    - name: Boot the release Linux kernel with loopback-only port forwards
      run: 'set -eu

        mkdir -p "$RUNNER_TEMP/final-linux"

        cp "$RUNNER_TEMP/exact-caddy/caddy" "$RUNNER_TEMP/final-linux/caddy-candidate"

        (cd "$RUNNER_TEMP/final-linux" && shasum -a 256 caddy-candidate > SHA256SUMS)

        bash diagnostics/linux-apple/boot.sh "$GUEST_ARCH" "$RUNNER_TEMP/image"

        python3 - <<''CHECK''

        from pathlib import Path

        import hashlib, json, os

        t=Path(os.environ[''RUNNER_TEMP''])

        assert hashlib.sha256((t/''exact-caddy/caddy'').read_bytes()).hexdigest()==json.loads((t/''linux.json'').read_text())[''caddy'']

        CHECK

        '
      env:
        GUEST_ARCH: amd64
        GUEST_MACHINE: x86_64
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: signed-TUN-main-0d7d83c
        path: ${{ runner.temp }}/signed
    - run: 'mkdir -p clients/network-relay-tun/dist

        ditto -x -k "$RUNNER_TEMP/signed/tun-app.zip" clients/network-relay-tun/dist'
    - name: Click Connect in the signed app using XCTest
      run: bash diagnostics/history-ui/gui.sh
    - name: Stop Linux fixture
      if: always()
      run: 'if [[ -f "$RUNNER_TEMP/guest.pid" ]]; then kill "$(cat "$RUNNER_TEMP/guest.pid")"
        || true; fi

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ui-network-preflight
        path: ${{ runner.temp }}/evidence
        retention-days: 7
    needs: package
  package:
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: 0d7d83ca37d5da9154ae0004e545a6bcf68d2c58
        path: clients
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
      with:
        toolchain: stable
    - name: Build the unmodified release sources and preserve the signed bundle
      run: 'set -euo pipefail

        cd clients/network-relay-tun

        # The parallel acceptance job uses build-macos.sh with all debug test suites.

        # Here keep the release packaging steps and preserve the signed output for
        replay.

        sed -e ''/^cargo test /d'' -e ''/^swift test /d'' build-macos.sh > .build-history-bundle.sh

        bash .build-history-bundle.sh

        ditto -c -k --sequesterRsrc --keepParent "dist/Network Relay Tun.app" "$RUNNER_TEMP/tun-app.zip"

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: signed-TUN-main-0d7d83c
        path: ${{ runner.temp }}/tun-app.zip
        retention-days: 3
