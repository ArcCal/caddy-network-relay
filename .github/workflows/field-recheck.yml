name: Verify DNS session recovery and cold browser lookups on macOS
'on':
  push:
    branches:
    - audit/tun-ui-system-sockets-20261121
permissions:
  contents: read
  actions: read
jobs:
  gui:
    name: Live mode UI (${{ matrix.variant }})
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: linux-amd64-guest
        path: ${{ runner.temp }}/image
        github-token: ${{ github.token }}
        run-id: 44747890260
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: caddy-network-relay-linux-amd64
        path: ${{ runner.temp }}/exact-caddy
        run-id: 44835734583
        github-token: ${{ github.token }}
    - name: Boot the release Linux kernel with loopback-only port forwards
      run: 'set -eu

        mkdir -p "$RUNNER_TEMP/final-linux"

        cp "$RUNNER_TEMP/exact-caddy/caddy" "$RUNNER_TEMP/final-linux/caddy-candidate"

        (cd "$RUNNER_TEMP/final-linux" && shasum -a 256 caddy-candidate > SHA256SUMS)

        bash diagnostics/linux-apple/boot.sh "$GUEST_ARCH" "$RUNNER_TEMP/image"

        python3 - <<''CHECK''

        from pathlib import Path

        import hashlib, json, os

        t=Path(os.environ[''RUNNER_TEMP''])

        assert hashlib.sha256((t/''exact-caddy/caddy'').read_bytes()).hexdigest()==json.loads((t/''linux.json'').read_text())[''caddy'']

        CHECK

        '
      env:
        GUEST_ARCH: amd64
        GUEST_MACHINE: x86_64
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: b15844f5329c3578291523c81fccfa222ba44426
        fetch-depth: 2
        path: clients
        persist-credentials: false
    - name: Reproduce both failures with the original macOS packet worker
      run: |
        set -eu
        original="$RUNNER_TEMP/original-client"
        test "$(git -C clients rev-parse HEAD^)" = f77f1d8c09c59677b14348b808ea5dceff46fab2
        git -C clients worktree add --detach "$original" HEAD^
        cp clients/network-relay-tun/TunEngine/tests/udp_path.rs "$original/network-relay-tun/TunEngine/tests/udp_path.rs"
        export CARGO_HOME="$PWD/clients/network-relay-tun/.cargo"
        export CARGO_TARGET_DIR="$PWD/clients/network-relay-tun/target"
        log="$RUNNER_TEMP/baseline-dns.log"
        if cargo test --locked --manifest-path "$original/network-relay-tun/TunEngine/Cargo.toml" --test udp_path dns > "$log" 2>&1; then
          cat "$log"
          exit 1
        fi
        tail -40 "$log"
        grep -Fq 'the same-port DNS retry could not open a fresh association' "$log"
        grep -Fq 'a new lookup could not open while an answered DNS mapping occupied the budget' "$log"
        grep -Fq '1 passed; 2 failed' "$log"
    - name: Build, test and verify the signed client with the repaired packet worker
      run: |
        set -eu
        bash clients/network-relay-tun/build-macos.sh
        codesign --verify --deep --strict "clients/network-relay-tun/dist/Network Relay Tun.app"
    - name: prepare GUI acceptance
      timeout-minutes: 4
      run: bash diagnostics/history-ui/gui.sh prepare
    - name: network GUI acceptance
      timeout-minutes: 2
      run: bash diagnostics/history-ui/gui.sh network
      id: network
    - name: missing GUI acceptance
      timeout-minutes: 4
      run: bash diagnostics/history-ui/gui.sh missing
    - name: install GUI acceptance
      timeout-minutes: 2
      run: bash diagnostics/history-ui/gui.sh install
      if: '!cancelled() && matrix.variant == ''candidate'' && steps.network.outcome
        == ''success'''
    - name: installed GUI acceptance
      timeout-minutes: 6
      run: bash diagnostics/history-ui/gui.sh installed
      if: '!cancelled() && matrix.variant == ''candidate'' && steps.network.outcome
        == ''success'''
    - name: Record the UI assertions for each completed phase
      if: always()
      run: "for phase in missing installed; do\n  bundle=\"$RUNNER_TEMP/ui-$phase.xcresult\"\
        \n  if [[ -d \"$bundle\" ]]; then\n    xcrun xcresulttool get test-results\
        \ summary --path \"$bundle\" > \"$RUNNER_TEMP/$phase-summary.json\"\n    python3\
        \ - \"$RUNNER_TEMP/$phase-summary.json\" <<'LOG'\nimport json,sys\ns=json.load(open(sys.argv[1]))\n\
        print('UI result:',s.get('result'))\nfor f in s.get('testFailures',[]):\n\
        \ print(str(f.get('failureText','')).split('Attributes:')[0][:700])\nLOG\n\
        \  fi\ndone\n"
    - name: cleanup GUI acceptance
      timeout-minutes: 2
      run: bash diagnostics/history-ui/gui.sh cleanup
      if: always()
    - name: Stop Linux fixture
      if: always()
      run: 'if [[ -f "$RUNNER_TEMP/guest.pid" ]]; then kill "$(cat "$RUNNER_TEMP/guest.pid")"
        || true; fi

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: mode-check-${{ matrix.variant }}
        path: ${{ runner.temp }}/evidence
        retention-days: 7
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: network-relay-tun-dns-repair-macos-arm64
        path: clients/network-relay-tun/dist/NetworkRelayTun-*-macos-arm64.zip
        if-no-files-found: error
        retention-days: 7
    strategy:
      fail-fast: false
      matrix:
        variant:
        - candidate
    env:
      MODE_VARIANT: ${{ matrix.variant }}
