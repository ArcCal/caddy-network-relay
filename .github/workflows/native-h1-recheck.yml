name: Trace RS close delivery and origin completion on the x86 Linux fixture
'on':
  push:
    branches:
    - audit/rs-close-boundary-observation-20261121
permissions:
  contents: read
  actions: read
jobs:
  boundary:
    name: Native NF and release Linux ${{ matrix.arch }}
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: abb966352880c7521cbd9a1e23e9c2f6e70906b0
        sparse-checkout: diagnostics
        path: native-probe
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: linux-${{ matrix.arch }}-guest
        path: ${{ runner.temp }}/image
        github-token: ${{ github.token }}
        run-id: 44747890260
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: caddy-network-relay-linux-${{ matrix.arch }}
        path: ${{ runner.temp }}/exact-caddy
        run-id: 44835734583
        github-token: ${{ github.token }}
    - name: Boot the release Linux kernel with loopback-only port forwards
      run: "set -eu\nmkdir -p \"$RUNNER_TEMP/final-linux\"\ncp \"$RUNNER_TEMP/exact-caddy/caddy\"\
        \ \"$RUNNER_TEMP/final-linux/caddy-candidate\"\n(cd \"$RUNNER_TEMP/final-linux\"\
        \ && shasum -a 256 caddy-candidate > SHA256SUMS)\npython3 - <<'PATCH'\nfrom\
        \ pathlib import Path\np=Path('diagnostics/linux-apple/guest.py')\ns=p.read_text()\n\
        anchor='    jobs = start_servers(credentials())'\nassert s.count(anchor)==1\n\
        s=s.replace(anchor,anchor+'\\n'+ '\\n'.join('    '+line for line in Path('diagnostics/linux-apple/h1-origin.py').read_text().splitlines()))\n\
        p.write_text(s)\nPATCH\npython3 - <<'NET'\nfrom pathlib import Path\np=Path('diagnostics/linux-apple/boot.sh')\n\
        s=p.read_text().replace('-netdev \"$net\"','-netdev socket,id=wire,udp=127.0.0.1:11080,localaddr=127.0.0.1:11081\
        \ -device virtio-net-pci,netdev=wire,mac=52:54:00:11:22:34 -netdev \"$net\"\
        ')\np.write_text(s)\np=Path('diagnostics/linux-apple/guest.py')\ns=p.read_text()\n\
        a='    if BIND == \"0.0.0.0\":'\ns=s.replace(a, a+'\\n        links=json.loads(command(\"\
        ip\",\"-j\",\"link\")); wire=next(i[\"ifname\"] for i in links if i.get(\"\
        address\")==\"52:54:00:11:22:34\"); mgmt=next(i[\"ifname\"] for i in links\
        \ if i[\"ifname\"] not in (wire,\"lo\")); command(\"ip\",\"addr\",\"flush\"\
        ,\"dev\",wire); command(\"ip\",\"link\",\"set\",mgmt,\"up\"); command(\"ip\"\
        ,\"addr\",\"replace\",\"10.0.2.15/24\",\"dev\",mgmt)')\na='    identity =\
        \ environment_record()'\nassert s.count(a)==1\np.write_text(s.replace(a,'''\
        \    wire = next(link[\"ifname\"] for link in json.loads(command(\"ip\",\"\
        -j\",\"link\")) if link.get(\"address\")==\"52:54:00:11:22:34\")\n    command(\"\
        ip\",\"link\",\"set\",wire,\"up\")\n    command(\"ip\",\"addr\",\"add\",\"\
        192.0.2.2/30\",\"dev\",wire)\n'''+a))\nNET\nsudo \"$(command -v python3)\"\
        \ -u diagnostics/linux-apple/h1-link.py > \"$RUNNER_TEMP/evidence-link.log\"\
        \ 2>&1 &\nbash diagnostics/linux-apple/boot.sh \"$GUEST_ARCH\" \"$RUNNER_TEMP/image\"\
        \npython3 - <<'CHECK'\nfrom pathlib import Path\nimport hashlib, json, os\n\
        t=Path(os.environ['RUNNER_TEMP'])\nassert hashlib.sha256((t/'exact-caddy/caddy').read_bytes()).hexdigest()==json.loads((t/'linux.json').read_text())['caddy']\n\
        CHECK\n"
      env:
        GUEST_ARCH: ${{ matrix.arch }}
        GUEST_MACHINE: ${{ matrix.machine }}
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: 0d7d83ca37d5da9154ae0004e545a6bcf68d2c58
        path: clients
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
      with:
        toolchain: stable
    - name: Build production clients and the native controller entry points
      run: 'set -eu

        python3 diagnostics/linux-apple/trace-rs.py

        mkdir -p "$RUNNER_TEMP/products"

        cargo build --locked --release --manifest-path clients/network-relay-rs/Cargo.toml
        --bin network-relay-rs

        cp clients/network-relay-rs/target/release/network-relay-rs "$RUNNER_TEMP/products/rs"

        '
    - name: Verify the production SOCKS terminal condition and origin half-close
      run: 'python3 - <<''PYCASE''

        from pathlib import Path

        p=Path(''diagnostics/linux-apple/products.py'')

        s=p.read_text()

        start=s.index(''                before=json.loads(fetch("counts"))'')

        end=s.index(''            finally:'',start)

        p.write_text(s[:start]+''                from __main__ import boundary\n                return
        boundary(port, ctx)\n''+s[end:])

        PYCASE

        sudo tcpdump -l -n -t -i lo0 ''tcp[tcpflags] & (tcp-fin|tcp-rst) != 0'' >
        "$RUNNER_TEMP/close-signals" 2>/dev/null &

        python3 diagnostics/linux-apple/h1-mac.py'
    - name: Stop Linux fixture
      if: always()
      run: 'if [[ -f "$RUNNER_TEMP/guest.pid" ]]; then kill "$(cat "$RUNNER_TEMP/guest.pid")"
        || true; fi

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: h1-nf-reset-${{ matrix.arch }}
        path: ${{ runner.temp }}/evidence
        retention-days: 7
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-24.04
          machine: x86_64
