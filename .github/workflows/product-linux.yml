name: Release NF, RS and TUN against the final Linux candidate
'on':
  push:
    branches:
    - audit/final-product-interop-20261120
permissions:
  contents: read
  actions: read
jobs:
  products:
    name: NF, RS and TUN against both Linux arm64 servers
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: abb966352880c7521cbd9a1e23e9c2f6e70906b0
        sparse-checkout: diagnostics
        path: native-probe
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: linux-arm64-guest
        path: ${{ runner.temp }}/image
        github-token: ${{ github.token }}
        run-id: 44746990303
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: production-pair-arm64
        path: ${{ runner.temp }}/final-linux
        github-token: ${{ github.token }}
        run-id: 44760250937
    - name: Boot the release Linux kernel with loopback-only port forwards
      run: bash diagnostics/linux-apple/boot.sh arm64 "$RUNNER_TEMP/image"
    - name: Match the guest ELF to the native tested build
      run: "python3 - <<'PYVERIFY'\nimport hashlib, json, os\nfrom pathlib import\
        \ Path\nroot = Path(os.environ[\"RUNNER_TEMP\"])\nwith (root/\"final-linux/caddy-candidate\"\
        ).open(\"rb\") as binary:\n    expected = hashlib.file_digest(binary, \"sha256\"\
        ).hexdigest()\nif json.loads((root/\"linux.json\").read_bytes())[\"caddy\"\
        ] != expected:\n    raise RuntimeError(\"The Linux guest is not serving the\
        \ requested build\")\nPYVERIFY\n"
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: 274fc9678cd8db65eb9607489ccd732a6a753d07
        path: clients
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
      with:
        toolchain: stable
    - name: Build production clients and the native controller entry points
      run: bash diagnostics/linux-apple/build-products.sh "$PWD/clients" "$PWD/native-probe/diagnostics/RelayProbe.swift"
        "$RUNNER_TEMP/products"
    - name: Test all three product transports on H2 and H3
      run: "python3 - <<'PYHOST'\nimport os, runpy, subprocess\nt=os.environ['RUNNER_TEMP']\n\
        with runpy.run_path('native-probe/diagnostics/run-native-probe.py')['origin_name']():\n\
        \    subprocess.run(['python3','diagnostics/linux-apple/products.py',t+'/products',t+'/evidence'],check=True)\n\
        PYHOST"
    - name: Stop Linux fixture
      if: always()
      run: 'if [[ -f "$RUNNER_TEMP/guest.pid" ]]; then kill "$(cat "$RUNNER_TEMP/guest.pid")"
        || true; fi

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: macos-products-to-linux-arm64
        path: ${{ runner.temp }}/evidence
        retention-days: 7
