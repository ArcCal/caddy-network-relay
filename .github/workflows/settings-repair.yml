name: Isolate RS TLS shutdown on Mac without a forwarder
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  candidate:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: 0d7d83ca37d5da9154ae0004e545a6bcf68d2c58
        path: relay
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
      with:
        toolchain: stable
    - name: Apply exact runtime and regression-test changes
      run: 'cd relay

        git apply ../diagnostics/settings-20261121/candidate.patch

        cp ../diagnostics/settings-20261121/history_nov21.rs network-relay-rs/Core/tests/

        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/relay-target" >> "$GITHUB_ENV"

        '
    - name: Compare authenticated close, bare FIN and TCP reset through production
        SOCKS
      working-directory: relay
      run: 'cargo build --locked --manifest-path network-relay-rs/Cargo.toml --bin
        network-relay-rs

        python3 ../diagnostics/settings-20261121/direct-close.py "$CARGO_TARGET_DIR/debug/network-relay-rs"'
'on':
  push:
    branches:
    - audit/rs-direct-tls-close-20261121
