name: Verify old WARP quotas and migration on native Linux
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04
        - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: 0d7d83ca37d5da9154ae0004e545a6bcf68d2c58
        path: relay
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
      with:
        toolchain: stable
    - name: Apply exact runtime and regression-test changes
      run: 'cd relay

        git apply ../diagnostics/settings-20261121/candidate.patch

        cp ../diagnostics/settings-20261121/history_nov21.rs network-relay-rs/Core/tests/

        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/relay-target" >> "$GITHUB_ENV"

        '
    - name: Run both real CLI configurations over both WARP transports
      working-directory: relay/network-relay-cf-masque
      run: 'cp ../../diagnostics/settings-20261121/quota_migrate_probe.rs tests/

        cargo test --locked --test quota_migrate_probe -- --nocapture'
'on':
  push:
    branches:
    - audit/warp-quota-migration-20261121
