name: Check native TLS reset delivery without either relay product
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  candidate:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Test the macOS socket independently with Python and OpenSSL
      run: python3 diagnostics/settings-20261121/direct-close.py
'on':
  push:
    branches:
    - audit/mac-direct-socket-reset-20261121
