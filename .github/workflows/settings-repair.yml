name: Check the exact bounded abort candidate on native Mac and Linux
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  candidate:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: 7bf095c481ca527712798b63fb3b7b1e58992f1d
        path: relay
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
      with:
        toolchain: stable
    - name: Select an isolated build output directory
      run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/relay-target" >> "$GITHUB_ENV"
    - name: Test runtime candidate, stalled reader budget and client core
      working-directory: relay
      run: "git apply ../diagnostics/settings-20261121/bounded-abort.patch\ncargo\
        \ fmt --manifest-path network-relay-rs/Core/Cargo.toml -- --check\ncargo clippy\
        \ --locked --manifest-path network-relay-rs/Core/Cargo.toml --lib -- -D warnings\n\
        cargo test --locked --manifest-path network-relay-rs/Core/Cargo.toml -- --test-threads=1\n\
        if [ \"$(uname)\" = Darwin ]; then\n  for i in 1 2 3 4; do cargo test --locked\
        \ --manifest-path network-relay-rs/Core/Cargo.toml --lib local_bulk_write_followed_by_abort_reports_reset;\
        \ done\nfi\n"
    strategy:
      fail-fast: false
      matrix:
        runner:
        - xcode-27
        - ubuntu-24.04
        - ubuntu-24.04-arm
'on':
  push:
    branches:
    - audit/rs-bounded-abort-candidate-20261121
