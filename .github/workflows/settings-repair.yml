name: Compare macOS abort delivery from production local stream
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  candidate:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: ArcCal/network-relay
        ref: 0d7d83ca37d5da9154ae0004e545a6bcf68d2c58
        path: relay
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
      with:
        toolchain: stable
    - name: Apply exact runtime and regression-test changes
      run: 'cd relay

        git apply ../diagnostics/settings-20261121/candidate.patch

        cp ../diagnostics/settings-20261121/history_nov21.rs network-relay-rs/Core/tests/

        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/relay-target" >> "$GITHUB_ENV"

        '
    - name: Compare immediate reset, fixed delay and bounded queue drainage
      working-directory: relay
      run: "python3 ../diagnostics/settings-20261121/reset-trace.py\ncat ../diagnostics/settings-20261121/bulk-abort.rs\
        \ >> network-relay-rs/Core/src/backend.rs\nfor variant in 0 fixed 1 1 fixed\
        \ 0; do\n  TRACE_DRAIN_LOCAL=\"$variant\" cargo test --locked --manifest-path\
        \ network-relay-rs/Core/Cargo.toml --lib native_bulk_abort_delivery -- --nocapture\n\
        done\n"
'on':
  push:
    branches:
    - audit/rs-abort-stream-20261121
