name: test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-permissions:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: go1.27.4
      GOPROXY: https://proxy.golang.org|direct
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate downloaded toolchain and compilation cache
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/go-permissions-modules" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/go-permissions-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.11'
          cache: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ArcCal/network-relay
          ref: e10e34c0d433833cc0f36e48111086bdd8cb83d2
          path: network-relay-build-input
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: caddy-dns/cloudflare
          path: cloudflare-src
          persist-credentials: false
      - name: Reproduce old failure and verify exact private source
        run: python3 .github/go-source-permissions-check.py before
      - name: Run policy, permissions and cleanup regressions
        run: |
          python3 -m unittest discover -s deploy -p test_go_tls_policy.py -v 2>&1 | tee "$RUNNER_TEMP/go-permissions-evidence/tests.log"
      - name: Exercise actual macOS to Linux server build helpers
        shell: bash
        run: |
          source network-relay-build-input/build-linux-servers-on-linux.sh
          caddy_src=$PWD
          cloudflare_src=$PWD/cloudflare-src
          work=$RUNNER_TEMP/go-permissions-work
          output=$work/output
          host_arch=arm64
          jobs=4
          failures=0
          mkdir -p "$output/logs"
          lr_run prepare-caddy lr_prepare_caddy
          (( failures == 0 ))
          lr_run build-caddy-amd64 lr_build_caddy amd64
          (( failures == 0 ))
          lr_run build-caddy-arm64 lr_build_caddy arm64
          (( failures == 0 ))
          python3 .github/go-source-permissions-check.py after
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-source-permissions-macos
          path: |
            ${{ runner.temp }}/go-permissions-evidence
            ${{ runner.temp }}/go-permissions-work/output/logs
          retention-days: 7
