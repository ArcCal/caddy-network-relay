# Lint and test on every push and pull request; build Caddy with the plugin
# for Linux x86_64 and arm64. Weekly, rerun everything so that new
# vulnerability records for the dependencies and the pinned transports
# (third_party) fail the build even when nothing was pushed.
name: test

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: lint and test (Go 1.26)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Check pinned transport vulnerability records
        run: |
          mapfile -t transport_queries < <(jq -r '.snapshots[] | "\(.module)@\(.version)"' third_party/provenance.json)
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=query -json "${transport_queries[@]}" > transport-vulnerabilities.json
          jq -s -e '[.[] | select(has("osv"))] | length == 0' transport-vulnerabilities.json
      - run: python3 third_party/test_upstream.py
      - run: RELAY_STRESS_MB=16 go test -race -count=1 -timeout 40m ./...
      - run: shellcheck -S warning -e SC1111,SC1091 deploy/install.sh
      - run: python3 deploy/test_install.py -v

  go127:
    name: test (Go 1.27)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27"
      # Local transport patches keep the same reviewed implementation and
      # extended CONNECT APIs on both toolchains and with either build mode.
      - run: GOTOOLCHAIN=local RELAY_STRESS_MB=16 go test -count=1 -timeout 40m -tags http2legacy ./...
      - run: GOTOOLCHAIN=local GODEBUG=http2xconnect=1 go test -count=1 -run 'HTTP2Ext|TCP|Masque|HTTP3|Caddyfile|Target|Success|Capsule|HTTP1|Extended|Unreachable|Accessor' ./...

  build:
    name: build ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 GOARCH=${{ matrix.arch }} go build -tags http2legacy -trimpath -ldflags '-s -w' -o caddy ./cmd/caddy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caddy-network-relay-linux-${{ matrix.arch }}
          path: caddy
